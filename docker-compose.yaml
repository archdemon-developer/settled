services:
  postgres:
    image: postgres:18-alpine
    container_name: settled-postgres
    environment:
      POSTGRES_USER: settled
      POSTGRES_PASSWORD: settled_dev
      POSTGRES_DB: settled
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settled -d settled"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - settled-net

  redis:
    image: redis:8.10.1-alpine
    container_name: settled-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - settled-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: settled-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://settled:settled_dev@postgres:5432/settled
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - settled-net

volumes:
  postgres_data:

networks:
  settled-net:
    driver: bridge