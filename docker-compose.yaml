services:
  postgres:
    image: postgres:latest
    container_name: settled-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d settled" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - settled-network
  redis:
    image: redis:7-alpine
    container_name: settled-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - settled-network
    restart: unless-stopped
  backend:
    build:
      context: ./settled-backend
      dockerfile: Dockerfile
    container_name: settled-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    networks:
      - settled-network
    restart: unless-stopped
  frontend:
    build:
      context: ./settled-ui
      dockerfile: Dockerfile
    container_name: settled-ui
    ports:
      - "3000:3000"
    networks:
      - settled-network
    restart: unless-stopped

networks:
  settled-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local