name: Security Scans

on:
  workflow_run:
    workflows: ["Test & Lint"]
    types: [completed]
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Go Vulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27'
          go-package: ./...