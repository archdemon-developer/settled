spring:
  application:
    name: settled-test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true

  redis:
    host: localhost
    port: 6379

logging:
  level:
    root: INFO
    com.settled: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info