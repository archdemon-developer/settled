version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - exhaustruct    # deprecated in v2
    - wsl            # deprecated in v2
  exclusions:
    generated: lax
    presets:
      - std-error-handling    # Keep this (error handling is critical)
    paths:
      - '.*_test\.go'         # Exclude test files
      - test
      - tests
      
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
  exclusions:
    generated: lax
    paths:
      - '.*_test\.go'